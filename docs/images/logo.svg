<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="slate-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-395
        342,-197
        342,197
        0,395
        -342,197
        -342,-197
      " fill="none" stroke="#0f172a" stroke-width="40" stroke-linejoin="round" />

      <polygon points="
        0,-360
        310,-179
        310,179
        0,360
        -310,179
        -310,-179
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.4" stroke-dasharray="16, 12" />

      <!-- Symmetrical Watertight Silhouette Underlay -->
      <path d="
        M 0 -290
        L 95 -245 L 175 -205 L 220 -130 L 235 -40 L 225 60 L 180 160 L 110 240 L 0 280
        L -110 240 L -180 160 L -225 60 L -235 -40 L -220 -130 L -175 -205 L -95 -245
        Z
      " fill="#0b0f19" />

      <!-- Upper Casque / Crest (Vector Dimensional Hierarchy) -->
      <!-- Center Crown Ridge -->
      <polygon points="0,-290 40,-240 0,-180 -40,-240" fill="#475569" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,-180 50,-120 0,-70 -50,-120" fill="#334155" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,-70 55,-10 0,50 -55,-10" fill="#1e293b" stroke="#0f172a" stroke-width="2" />

      <!-- Left Crest Facets -->
      <polygon points="0,-290 -40,-240 -115,-250 -95,-285" fill="#334155" stroke="#0f172a" stroke-width="2" />
      <polygon points="-40,-240 0,-180 -60,-170 -115,-200" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="-115,-250 -40,-240 -115,-200 -175,-205" fill="#0f172a" stroke="#0f172a" stroke-width="2" />

      <!-- Right Crest Facets -->
      <polygon points="0,-290 40,-240 115,-250 95,-285" fill="#64748b" stroke="#0f172a" stroke-width="2" />
      <polygon points="40,-240 0,-180 60,-170 115,-200" fill="#475569" stroke="#0f172a" stroke-width="2" />
      <polygon points="115,-250 40,-240 115,-200 175,-205" fill="#334155" stroke="#0f172a" stroke-width="2" />

      <!-- Temporal Temple Armor (Left & Right) -->
      <polygon points="-175,-205 -115,-200 -140,-130 -220,-130" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="175,-205 115,-200 140,-130 220,-130" fill="#475569" stroke="#0f172a" stroke-width="2" />

      <!-- Stereoscopic Turret Eye Housing (Left - Legacy Index Vision) -->
      <polygon points="-220,-130 -140,-130 -120,-40 -205,-30" fill="#0f172a" stroke="#0f172a" stroke-width="2" />
      <polygon points="-205,-30 -120,-40 -130,40 -210,30" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="-120,-40 -60,-60 -50,10 -130,40" fill="#0b0f19" stroke="#0f172a" stroke-width="2" />

      <!-- Left Optical Turret Ring (Legacy Ada-002) -->
      <circle cx="-160" cy="-5" r="38" fill="#0b0f19" stroke="#334155" stroke-width="5" />
      <circle cx="-160" cy="-5" r="26" fill="url(#cyan-glow)" />
      <polygon points="-160,-22 -148,-5 -160,12 -172,-5" fill="#0b0f19" />
      <circle cx="-160" cy="-5" r="6" fill="#ffffff" />

      <!-- Stereoscopic Turret Eye Housing (Right - Target 3-Large / Voyage Vision) -->
      <polygon points="220,-130 140,-130 120,-40 205,-30" fill="#334155" stroke="#0f172a" stroke-width="2" />
      <polygon points="205,-30 120,-40 130,40 210,30" fill="#475569" stroke="#0f172a" stroke-width="2" />
      <polygon points="120,-40 60,-60 50,10 130,40" fill="#1e293b" stroke="#0f172a" stroke-width="2" />

      <!-- Right Optical Turret Ring (Target Store) -->
      <circle cx="160" cy="-5" r="38" fill="#0b0f19" stroke="#475569" stroke-width="5" />
      <circle cx="160" cy="-5" r="26" fill="url(#cyan-glow)" />
      <polygon points="160,-22 172,-5 160,12 148,-5" fill="#0b0f19" />
      <circle cx="160" cy="-5" r="6" fill="#ffffff" />

      <!-- Bridge of Snout & Frontal Plate (Dual-Write Bridge) -->
      <polygon points="-60,-170 0,-180 0,-70 -60,-60" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,-180 60,-170 60,-60 0,-70" fill="#334155" stroke="#0f172a" stroke-width="2" />

      <polygon points="-60,-60 0,-70 0,50 -55,40" fill="#0f172a" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,-70 60,-60 55,40 0,50" fill="#1e293b" stroke="#0f172a" stroke-width="2" />

      <!-- Lower Muzzle & Mandible (Symmetrical Precision) -->
      <polygon points="-55,40 0,50 0,140 -60,120" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,50 55,40 60,120 0,140" fill="#334155" stroke="#0f172a" stroke-width="2" />

      <polygon points="-60,120 0,140 0,220 -40,195" fill="#0f172a" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,140 60,120 40,195 0,220" fill="#1e293b" stroke="#0f172a" stroke-width="2" />

      <!-- Jowl Armor Facets (Left & Right) -->
      <polygon points="-130,40 -55,40 -60,120 -140,110" fill="#0b0f19" stroke="#0f172a" stroke-width="2" />
      <polygon points="130,40 55,40 60,120 140,110" fill="#1e293b" stroke="#0f172a" stroke-width="2" />

      <polygon points="-210,30 -130,40 -140,110 -195,95" fill="#0f172a" stroke="#0f172a" stroke-width="2" />
      <polygon points="210,30 130,40 140,110 195,95" fill="#334155" stroke="#0f172a" stroke-width="2" />

      <!-- Throat Gorget & Atomic Switch Chevron -->
      <polygon points="-40,195 0,220 40,195 0,280" fill="url(#cyan-glow)" stroke="#00f5ff" stroke-width="3" />
      <polygon points="-60,120 -40,195 0,280 -100,220" fill="#0b0f19" stroke="#0f172a" stroke-width="2" />
      <polygon points="60,120 40,195 0,280 100,220" fill="#1e293b" stroke="#0f172a" stroke-width="2" />

      <!-- Subtle Geometric Vector Node Accents on Hex Gate -->
      <circle cx="0" cy="-395" r="9" fill="#00f5ff" />
      <circle cx="342" cy="-197" r="9" fill="#00f5ff" />
      <circle cx="342" cy="197" r="9" fill="#00f5ff" />
      <circle cx="0" cy="395" r="9" fill="#00f5ff" />
      <circle cx="-342" cy="197" r="9" fill="#00f5ff" />
      <circle cx="-342" cy="-197" r="9" fill="#00f5ff" />
    </g>
  </g>
</svg>
